name = "zenin-club-orders"
main = "worker.js"
compatibility_date = "2026-10-21"
account_id = "740fd37c6a7741c5b502263b1f31f508"
workers_dev = true
# Public API address on the store domain (zone zeninclub.shop must be active in this Cloudflare account).
routes = [{ pattern = "api.zeninclub.shop", custom_domain = true }]

[vars]
ADMIN_USERNAME = "Admin"
# Confirms Tilopay payments (credentials are set in Admin → Pagos) of customers who closed the tab and releases abandoned orders.
[triggers]
crons = ["*/10 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "zenin-club-orders"
database_id = "83dc0013-331e-4315-acb8-6a1cb449cc28"

[[r2_buckets]]
binding = "DESIGNS"
bucket_name = "zenin-club-designs"
